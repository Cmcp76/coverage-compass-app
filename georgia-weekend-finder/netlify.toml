# Netlify settings. If this folder lives inside a bigger repo, set
# "Base directory" to georgia-weekend-finder in Netlify's site settings.
[build]
  publish = "."
  command = "npm test"

[[headers]]
  for = "/data/events.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
