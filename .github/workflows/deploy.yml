name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Base URL of the deployed analysis Worker (see /worker), e.g.
          # https://coverage-compass-analyze.<your-subdomain>.workers.dev.
          # Set as a repo/environment VARIABLE (Settings > Secrets and
          # variables > Actions > Variables), not a secret - it's a public
          # endpoint URL that ends up in the built JS bundle either way.
          # Left unset, the build behaves exactly as it does today: every
          # upload uses the local pattern-matching fallback engine.
          VITE_ANALYSIS_API_URL: ${{ vars.VITE_ANALYSIS_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
