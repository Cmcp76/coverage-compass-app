    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Decodes the path that public/404.html encoded into the query
      // string, restoring the real URL before React Router mounts.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <script type="text/javascript">
      // Set the theme class before React mounts (and before first paint),
      // so dark-mode users don't see a flash of the light theme. Mirrors
      // ThemeContext's own resolution order: saved preference, then system.
      ;(function () {
        try {
          var saved = localStorage.getItem('coverage-compass-theme')
          var isDark =
            saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (isDark) {
            document.documentElement.classList.add('dark')
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#1a2d48')
          }
        } catch (e) {
          // localStorage/matchMedia unavailable, default to light.
        }
      })()
    </script>
