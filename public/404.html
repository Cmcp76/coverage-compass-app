<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Coverage Compass</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side routing, so a hard refresh or a
      // direct link to a client route (e.g. /coverage-compass-app/tools)
      // 404s. This encodes the intended path into a query string and
      // redirects to index.html, which decodes it back via the matching
      // script in index.html before React Router ever sees the URL.
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
